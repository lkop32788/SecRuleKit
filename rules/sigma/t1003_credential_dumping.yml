title: LSASS Memory Access via Common Tools
id: b7e5a123-9012-4567-abcd-ef0123456789
status: stable
description: |
    Detects attempts to access LSASS process memory, which is commonly done by
    credential dumping tools such as Mimikatz, ProcDump, and others.
author: SecRuleKit Examples
date: 2026-02-10
tags:
    - attack.credential_access
    - attack.t1003
    - attack.t1003.001
logsource:
    category: process_access
    product: windows
detection:
    selection:
        TargetImage|endswith: '\lsass.exe'
        GrantedAccess|contains:
            - '0x1010'
            - '0x1410'
            - '0x147a'
            - '0x143a'
    filter_known_tools:
        SourceImage|endswith:
            - '\MsMpEng.exe'
            - '\WerFault.exe'
            - '\svchost.exe'
    condition: selection and not filter_known_tools
falsepositives:
    - Legitimate security products accessing LSASS
    - Windows Error Reporting
level: high
