[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "secrulekit"
version = "1.2.0"
description = "Parse, validate, convert, and manage YARA, Sigma, and Suricata security detection rules"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Cherno.x", email = "long544844@gmail.com" }
]
maintainers = [
    { name = "Cherno.x", email = "long544844@gmail.com" }
]
keywords = ["yara", "sigma", "suricata", "detection-rules", "security", "siem", "threat-hunting"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Environment :: Console",
]
requires-python = ">=3.8"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "typing-extensions>=4.0; python_version < '3.10'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "types-PyYAML",
]

[project.urls]
Homepage = "https://github.com/lkop32788/SecRuleKit"
Documentation = "https://github.com/lkop32788/SecRuleKit#readme"
Repository = "https://github.com/lkop32788/SecRuleKit"
Issues = "https://github.com/lkop32788/SecRuleKit/issues"
Changelog = "https://github.com/lkop32788/SecRuleKit/blob/main/CHANGELOG.md"
"Security Policy" = "https://github.com/lkop32788/SecRuleKit/blob/main/SECURITY.md"

[project.scripts]
secrulekit = "secrulekit.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["secrulekit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.8"
strict = true
ignore_missing_imports = true
